<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro en Clean Data</title>
    <link rel="stylesheet" href="../css/style_registro.css">
</head>

<body>
    <div class="contenedor">
        <div id="logo"></div>
        <h5>Registro</h5>
        <div class="fila">
            <div class="datos">
                <div class="icon">
                    <img src="../img/user.png" alt="">
                </div>
                <input type="text" placeholder="Nombre">
            </div>
            <div class="datos">
                <div class="icon">
                    <img src="../img/correo.png" alt="">
                </div>
                <input type="text" placeholder="Correo">
            </div>
        </div>
        <div class="fila">
            <div class="datos">
                <div class="icon">
                    <img src="../img/telefono.png" alt="">
                </div>
                <input type="text" placeholder="Teléfono">
            </div>
            <div class="datos">
                <div class="icon">
                    <img src="../img/candadoO.png" alt="">
                </div>
                <input type="password" placeholder="Contraseña">
            </div>
        </div>
        <button>Siguiente</button>
        <p class="link">¿Ya tienes una cuenta? <a class="registro" href="login.html">Inicio de sesión</a></p>
        <p class="pieP">Powered by Sakura</p>
    </div>
</body>

</html>
