<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recolección - Clean Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style_dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <nav id="sidebar"></nav>
        <main id="mainContent">
            <div class="container-fluid">
                <h1>Gestión de Recolección</h1>
                <button class="btn btn-primary mb-3" id="loadRecoleccionesBtn">Cargar Recolecciones</button>
                <div id="recoleccionesContent"></div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { requireAdmin } from '../js/auth/auth.js';
        import { renderSidebar } from '../js/components/sidebar.js';
        import { loadRecolecciones } from '../js/api/recoleccion.js';

        if (requireAdmin()) {
            renderSidebar();
            document.getElementById('loadRecoleccionesBtn').addEventListener('click', loadRecolecciones);
        }
    </script>
</body>
</html>
